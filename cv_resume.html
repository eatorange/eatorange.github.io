<!doctype html>
<html lang="en">

   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>CV/Resume</title>

      <!-- Google font: Figtree -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
         rel="stylesheet">

      <!-- Favicon -->
      <link rel="apple-touch-icon" sizes="180x180" href="img/favicons/apple-touch-icon.png">
      <link rel="icon" type="image/png" sizes="32x32" href="img/favicons/favicon-32x32.png">
      <link rel="icon" type="image/png" sizes="16x16" href="img/favicons/favicon-16x16.png">
      <link rel="icon" href="img/favicons/favicon.ico">
      <link rel="manifest" href="img/favicons/site.webmanifest">

      <!-- jQuery UI CSS (useful but not required for Boostrap v5.x) -->

      <!-- Local CSS -->
      <link href="css/main.css" rel="stylesheet">
   </head>

   <body id="top" data-current-page="cv_resume">

      <!-- Dynamically loaded navbar -->
      <div id="page-navbar"></div>

      <!-- wrapper div -->
      <div class="container" id="wrapper">

         <div class="row">
            <div class="col-12">

               <div class='card border-0 bg-white p-3'>
                  <div class='card-body'>

                     <h2 class='card-title chocolate fs-1'>CV</h2>
                     <p><a href="files/SLee-CV.pdf" download>Download this CV as a PDF</a>.</p>

                     <!-- CV/Resume embed -->
                     <div id="cv-desktop" class="border-0">
                        <iframe width="100%" height="1080px" frameborder="0" scrolling="yes"
                           class="embed-responsive-item" src="files/SLee-CV.pdf"
                           allowfullscreen></iframe>
                     </div>
                     <br><br>
                     <h2 class='card-title chocolate fs-1'>Resume</h2>
                     <p><a href="files/SLee-Resume.pdf" download>Download this Resume as a PDF</a>.</p>

                     <!-- CV/Resume embed -->
                     <div id="resume-desktop" class="border-0">
                        <iframe width="100%" height="1080px" frameborder="0" scrolling="yes"
                           class="embed-responsive-item" src="files/SLee-Resume.pdf"
                           allowfullscreen></iframe>
                     </div>

                  </div>
               </div>
            </div>
         </div>

      </div>

      <!-- Acknowledge banner -->
      <div id="acknowledge" class="px-5 py-4 bg-alice-blue mt-5"></div>

      <!-- Footer banner -->
      <div id="footer" class="mt-0"></div>

      <!-- Back to top button -->
      <a role="button" id="back-to-top" class="btn scroll-link bg-primary py-2 px-3" href="#top"><i
            class="bi fs-5 bi-caret-up-fill text-white"></i></a>

      <!-- jquery (optional in BS v5.x) -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"
         integrity="sha512-3gJwYpMe3QewGELv8k/BX9vcqhryRdzRMxVfq6ngyWXwo03GFEzjsUm8Q7RZcHPHksttq7/GFoxjCVUjkjvPdw=="
         crossorigin="anonymous" referrerpolicy="no-referrer"></script>

      <!-- jquery ui (optional in BS v5.x)-->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"
         integrity="sha512-57oZ/vW8ANMjR/KQ6Be9v/+/h6bq9/l3f0Oc7vn6qMqyhvPd1cvKBRWWpzu0QoneImqr2SkmO4MSqU+RpHom3Q=="
         crossorigin="anonymous" referrerpolicy="no-referrer"></script>

      <!-- boostrap bundle -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
         integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
         crossorigin="anonymous"></script>

      <!-- Local JS -->
      <script src="js/main.js"></script>

      <script>

         $(document).ready(function () {

            // Load the top page navbar
            $("#page-navbar").load("navbar.html", function () {
               console.log("navbar loaded");
            });

            // Load the acknowledge footer
            $("#acknowledge").load("acknowledge.html", function () {
               console.log("acknowledge loaded");
            });

         });
         // document.ready closes

      </script>

   </body>

</html>
